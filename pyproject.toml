[project]
name = "domainprior"
version = "0.1.0"
description = "Domain-specific synthetic prior for tabular foundation models (credit-risk track)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",          # parquet for splits/dumps
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
trees = ["lightgbm>=4.0", "catboost>=1.2", "xgboost>=2.0", "optuna>=3.0"]
torch-tfm = ["torch>=2.0", "tabicl>=2.0", "tabpfn>=2.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
